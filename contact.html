<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Contact Us | Favors Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="nav-container">
        <a href="index.html" class="logo">Flavors<span>.</span></a>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
            <!-- <li><button id="theme-toggle">Dark Mode</button></li> -->
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="contact-grid">
        <div>
          <h2>LET'S COLLABORATE</h2>
          <p style="margin-top: 1rem; color: var(--text-muted)">
            Ready to bring your bespoke fashion identity to life? Reach out
            using the form, or follow through official channels.
          </p>
        </div>
        <div>
          <!-- Native mail client submission for static hosting -->
          <form
            action="mailto:ikeagugodsfavour@gmail.com?subject=New%20Flavors%20Gallery%20inquiry"
            method="POST"
            enctype="text/plain"
            class="contact-form"
          >
            <div class="form-group">
              <label for="name">Full Name</label>
              <input type="text" id="name" name="name" required />
            </div>
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="reply-to" required />
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea
                id="message"
                name="message"
                rows="5"
                required
              ></textarea>
            </div>
            <button type="submit" class="btn">Send Concept Request</button>
          </form>
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Flavors Gallery. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
