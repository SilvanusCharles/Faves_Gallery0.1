<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Collections | Favors Gallery</title>
    <!-- Google Fonts Framework Integration -->
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="nav-container">
        <a href="index.html" class="logo">Favors<span>.</span></a>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="gallery.html" class="active">Gallery</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><button id="theme-toggle">Dark Mode</button></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <div style="text-align: center; margin-bottom: 5rem">
        <h2
          style="
            font-size: 2.2rem;
            text-transform: uppercase;
            margin-bottom: 1rem;
          "
        >
          The Edit
        </h2>
        <p
          style="
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
          "
        >
          Click any garment architecture to inspect full scale proportions
        </p>
      </div>

      <!-- Stable Pinterest Column Framework -->
      <div class="gallery-container">
        <div class="gallery-item" onclick="openLightbox(this)">
          <img src="photos/design1.jpg" alt="Editorial Fashion Concept 1" />
          <div class="gallery-info"><h3>01 / Minimalist Structure</h3></div>
        </div>
        <div class="gallery-item" onclick="openLightbox(this)">
          <img src="photos/design2.jpg" alt="Editorial Fashion Concept 2" />
          <div class="gallery-info"><h3>02 / Avant-Garde Draping</h3></div>
        </div>
        <div class="gallery-item" onclick="openLightbox(this)">
          <img src="photos/design3.jpg" alt="Editorial Fashion Concept 3" />
          <div class="gallery-info"><h3>03 / Fluid Symmetry</h3></div>
        </div>
        <div class="gallery-item" onclick="openLightbox(this)">
          <img src="photos/design4.jpg" alt="Editorial Fashion Concept 4" />
          <div class="gallery-info"><h3>04 / Linear Silhouette</h3></div>
        </div>
      </div>
    </main>

    <!-- Glassmorphic Lightbox Modal Container -->
    <div id="lightbox" class="modal" onclick="closeLightbox()">
      <span class="close-modal" onclick="closeLightbox()">&times;</span>
      <img class="modal-content" id="lightbox-img" alt="Lightbox Preview" />
    </div>

    <footer>
      <p style="letter-spacing: 1px; font-size: 0.8rem">
        &copy; 2026 Favors Gallery. Studio Architecture Portfolio.
      </p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
